<div class="container-fluid py-2 px-3" id="ai-ecosystem-container">
  <!-- Заголовок вкладки -->
  <div class="tab-header d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="tab-header-icon fs-4 text-warning">⚡</span>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h3 class="tab-header-title panel-header mb-0">Экосистема ИИ: Агенты, Навыки и MCP</h3>
          
        </div>
        <small class="tab-header-subtitle text-secondary">Управление пулом моделей, автономными агентами, MCP инструментами и реестром промптов</small>
      </div>
    </div>
    
  </div>
<ul class="nav nav-pills" id="ai-ecosystem-subtabs-nav" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active btn-sm rounded-pill px-3" id="subtab-ai-agents-btn" data-bs-toggle="pill" data-bs-target="#subpane-ai-agents" type="button" role="tab">
          <i class="bi bi-robot me-1"></i> Агенты (Agents)
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link btn-sm rounded-pill px-3" id="subtab-ai-skills-btn" data-bs-toggle="pill" data-bs-target="#subpane-ai-skills" type="button" role="tab">
          <i class="bi bi-lightning-charge-fill me-1"></i> Навыки (Skills)
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link btn-sm rounded-pill px-3" id="subtab-ai-mcp-btn" data-bs-toggle="pill" data-bs-target="#subpane-ai-mcp" type="button" role="tab">
          <i class="bi bi-plug-fill me-1"></i> MCP Серверы
        </button>
      </li>
    </ul>
  </div>

  <!-- Subtabs Content Panes -->
  <div class="tab-content" id="ai-ecosystem-subtabs-content">
    <!-- Subpane 1: Агенты -->
    <div class="tab-pane fade show active" id="subpane-ai-agents" role="tabpanel">
      <div id="ai-agents-embed-container">
        <!-- Injected from agents_tab -->
      </div>
    </div>

    <!-- Subpane 2: Навыки -->
    <div class="tab-pane fade" id="subpane-ai-skills" role="tabpanel">
      <div id="ai-skills-embed-container">
        <!-- Injected from skills_tab -->
      </div>
    </div>

    <!-- Subpane 3: MCP Серверы -->
    <div class="tab-pane fade" id="subpane-ai-mcp" role="tabpanel">
      <div id="ai-mcp-embed-container">
        <!-- Injected from mcp_tab -->
      </div>
    </div>
  </div>
</div>
