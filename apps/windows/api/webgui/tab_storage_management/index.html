<div class="container-fluid py-2 px-3" id="storage-management-container">
  <!-- Заголовок вкладки -->
  <div class="tab-header d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="tab-header-icon fs-4 text-warning">💽</span>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h3 class="tab-header-title panel-header mb-0">Накопители и Ресурс Дисков</h3>
          
        </div>
        <small class="tab-header-subtitle text-secondary">Управление физическими дисками, томами, SMART телеметрия и ресурс износа SSD/NVMe накопителей</small>
      </div>
    </div>
    
  </div>
<ul class="nav nav-pills" id="storage-subtabs-nav" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active btn-sm rounded-pill px-3" id="subtab-storage-volumes-btn" data-bs-toggle="pill" data-bs-target="#subpane-storage-volumes" type="button" role="tab">
          <i class="bi bi-hdd-stack me-1"></i> Диски и тома (Storage)
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link btn-sm rounded-pill px-3" id="subtab-storage-wear-btn" data-bs-toggle="pill" data-bs-target="#subpane-storage-wear" type="button" role="tab">
          <i class="bi bi-heart-pulse-fill me-1"></i> Ресурс и SMART (Wear Leveling)
        </button>
      </li>
    </ul>
  </div>

  <!-- Subtabs Content Panes -->
  <div class="tab-content" id="storage-subtabs-content">
    <!-- Subpane 1: Диски и тома -->
    <div class="tab-pane fade show active" id="subpane-storage-volumes" role="tabpanel">

      </div>
    </div>

    <!-- Subpane 2: Износ и SMART -->
    <div class="tab-pane fade" id="subpane-storage-wear" role="tabpanel">
      <div id="storage-wear-embed-container">

      </div>
    </div>
