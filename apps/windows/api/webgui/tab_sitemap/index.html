<div class="container-fluid p-3" id="sitemap-container">
  <!-- Заголовок вкладки -->
  <div class="tab-header d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="tab-header-icon fs-4 text-warning">🗺️</span>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h3 class="tab-header-title panel-header mb-0">Карта сайта (Sitemap)</h3>
          <span class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-2 py-1 ms-2" id="sitemap-total-badge">
            Всего вкладок: 77
          </span>
        </div>
        <small class="tab-header-subtitle text-secondary">Полный обзор всех функциональных разделов, панелей и сервисов веб-интерфейса AI Windows Admin</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <div class="d-flex align-items-center gap-2 px-3 py-1.5 rounded bg-body border border-secondary-subtle">
        <i class="bi bi-eye-slash-fill text-secondary fs-5"></i>
        <div>
          <div class="small text-body-secondary" style="font-size: 0.72rem;">СКРЫТО / СЛУЖЕБНЫЕ</div>
          <div class="fw-bold fs-6 text-secondary lh-1" id="sitemap-stat-hidden">0</div>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1.5 px-3 py-2 rounded" id="sitemap-refresh-btn" type="button" title="Обновить статус меню">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Обновить</span>
      </button>
    </div>
  </div>

  <!-- Блок поиска и фильтров -->
  <div class="card bg-body-tertiary border-secondary-subtle shadow-sm mb-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-center">
        <!-- Поле живого поиска -->
        <div class="col-12 col-md-5">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-body border-secondary-subtle text-body-secondary">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" class="form-control bg-body border-secondary-subtle text-body" id="sitemap-search-input" placeholder="Поиск по названию, описанию, ID или функциям..." autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="sitemap-search-clear-btn" title="Очистить поиск">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>

        <!-- Фильтр по статусу активности -->
        <div class="col-6 col-md-3">
          <select class="form-select form-select-sm bg-body border-secondary-subtle text-body" id="sitemap-status-filter" title="Фильтр по статусу">
            <option value="all">Все статусы (Все вкладки)</option>
            <option value="active">🟢 Только активные в меню</option>
            <option value="top">⭐ В верхнем меню</option>
            <option value="sidebar">📌 В боковом меню</option>
            <option value="hidden">⚪ Скрытые / Служебные</option>
          </select>
        </div>

        <!-- Фильтр по категории -->
        <div class="col-6 col-md-4">
          <select class="form-select form-select-sm bg-body border-secondary-subtle text-body" id="sitemap-category-filter" title="Фильтр по категориям">
            <option value="all">Все категории (Все направления)</option>
            <option value="system">💻 Система и Оборудование</option>
            <option value="security">🛡️ Безопасность и Диагностика</option>
            <option value="storage">💽 Диски и Хранилище</option>
            <option value="software">📦 Программы и Задачи</option>
            <option value="ai">🤖 ИИ и База Знаний</option>
            <option value="network">🌐 Сеть и Периферия</option>
            <option value="admin">⚙️ Администрирование и Настройки</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Список карточек вкладок -->
  <div class="row g-3" id="sitemap-cards-grid">
    <div class="col-12 text-center py-5 text-body-secondary" id="sitemap-loading-spinner">
      <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
      <div>Загрузка карты сайта и структуры меню...</div>
    </div>
  </div>

  <!-- Индикатор пустого результата поиска -->
  <div class="alert alert-secondary text-center py-4 d-none border-secondary-subtle" id="sitemap-empty-alert">
    <i class="bi bi-search fs-3 text-secondary d-block mb-2"></i>
    <div class="fw-semibold text-body">Вкладки не найдены</div>
    <div class="small text-body-secondary">Попробуйте изменить поисковый запрос или сбросить фильтры.</div>
  </div>
</div>
